name: Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string
      package:
        description: Package format to rebuild
        type: choice
        default: rpm
        options: [rpm, deb, all]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  deb:
    name: Build .deb
    if: github.event_name != 'workflow_dispatch' || inputs.package != 'rpm'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libxkbcommon-dev \
            libfreetype-dev \
            dpkg-dev \
            fakeroot \
            debhelper \
            libwlroots-dev \
            libevdev-dev \
            libinput-dev \
            libegl-dev \
            libpixman-1-dev \
            libxcursor-dev \
            wayland-protocols \
            xwayland

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.14.0"

      - name: Build River
        continue-on-error: true
        run: |
          cd vendor/river
          zig build -Doptimize=ReleaseSafe -Dxwayland || zig build -Doptimize=ReleaseSafe

      - name: Build notion-river
        run: cargo build --release

      - name: Extract version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build .deb package
        run: |
          PKG=notion-river
          VER=${{ steps.version.outputs.version }}
          PKGDIR="${PKG}_${VER}_amd64"

          mkdir -p "${PKGDIR}/DEBIAN"
          mkdir -p "${PKGDIR}/usr/bin"
          mkdir -p "${PKGDIR}/usr/share/wayland-sessions"
          mkdir -p "${PKGDIR}/usr/share/notion-river/examples"

          cp target/release/notion-river "${PKGDIR}/usr/bin/"
          cp target/release/notion-ctl "${PKGDIR}/usr/bin/"
          # rofi launcher + window switcher on PATH (referenced by config.toml)
          cp config-examples/notion-rofi-launch "${PKGDIR}/usr/bin/"
          cp config-examples/notion-rofi-window-switch "${PKGDIR}/usr/bin/"
          cp config-examples/notion-rofi-window-mode "${PKGDIR}/usr/bin/"
          # Include River binary if built
          test -f vendor/river/zig-out/bin/river && cp vendor/river/zig-out/bin/river "${PKGDIR}/usr/bin/" || true
          cp notion-river.desktop "${PKGDIR}/usr/share/wayland-sessions/"
          cp config-examples/start-river "${PKGDIR}/usr/share/notion-river/examples/"
          cp config-examples/river-init "${PKGDIR}/usr/share/notion-river/examples/"
          cp config-examples/autostart "${PKGDIR}/usr/share/notion-river/examples/"
          cp config-examples/notion-rofi-launch "${PKGDIR}/usr/share/notion-river/examples/"
          cp config-examples/notion-rofi-window-switch "${PKGDIR}/usr/share/notion-river/examples/"
          cp config-examples/notion-rofi-window-mode "${PKGDIR}/usr/share/notion-river/examples/"
          mkdir -p "${PKGDIR}/usr/share/notion-river/examples/waybar"
          cp config-examples/waybar/config.jsonc "${PKGDIR}/usr/share/notion-river/examples/waybar/"
          cp config-examples/waybar/style.css "${PKGDIR}/usr/share/notion-river/examples/waybar/"
          mkdir -p "${PKGDIR}/usr/share/notion-river/examples/rofi"
          cp config-examples/rofi/config.rasi "${PKGDIR}/usr/share/notion-river/examples/rofi/"
          cp config-examples/rofi/catppuccin-mocha.rasi "${PKGDIR}/usr/share/notion-river/examples/rofi/"
          mkdir -p "${PKGDIR}/usr/share/fish/vendor_completions.d"
          cp completions/notion-ctl.fish "${PKGDIR}/usr/share/fish/vendor_completions.d/"

          chmod 755 "${PKGDIR}/usr/bin/"*
          find "${PKGDIR}/usr/share/notion-river/examples" -type f -exec chmod 644 {} +
          chmod 755 "${PKGDIR}/usr/share/notion-river/examples/start-river" \
                    "${PKGDIR}/usr/share/notion-river/examples/river-init" \
                    "${PKGDIR}/usr/share/notion-river/examples/notion-rofi-launch" \
                    "${PKGDIR}/usr/share/notion-river/examples/notion-rofi-window-switch" \
                    "${PKGDIR}/usr/share/notion-river/examples/notion-rofi-window-mode"

          INSTALLED_SIZE=$(du -sk "${PKGDIR}" | cut -f1)

          cat > "${PKGDIR}/DEBIAN/control" <<EOF
          Package: notion-river
          Version: ${VER}
          Architecture: amd64
          Maintainer: Marenz <marenz@users.noreply.github.com>
          Installed-Size: ${INSTALLED_SIZE}
          Depends: libwayland-client0, libcairo2, libpango-1.0-0, libpangocairo-1.0-0, libxkbcommon0, libfreetype6
          Recommends: foot, waybar, rofi-wayland
          Section: x11
          Priority: optional
          Homepage: https://github.com/Marenz/notion-river
          Description: Notion/Ion3-style static tiling window manager for River
           notion-river is a window manager for the River Wayland compositor that
           implements static tiling from the Notion WM. The screen layout is a
           persistent wireframe of frames that exist independently of windows.
           .
           Requires the River compositor (0.4.x+) to be installed separately.
          EOF

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' "${PKGDIR}/DEBIAN/control"

          dpkg-deb --build --root-owner-group "${PKGDIR}"

      - name: Upload .deb
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: "*.deb"

  rpm:
    name: Build .rpm
    if: github.event_name != 'workflow_dispatch' || inputs.package != 'deb'
    runs-on: ubuntu-latest
    container:
      image: registry.opensuse.org/opensuse/tumbleweed:latest
    steps:
      - name: Install system tools
        run: |
          zypper --non-interactive install \
            git \
            tar \
            gzip \
            curl \
            rpm-build \
            cargo \
            rust \
            xz \
            pkg-config \
            wayland-devel \
            wayland-protocols-devel \
            wlroots-devel \
            cairo-devel \
            pango-devel \
            libxkbcommon-devel \
            freetype2-devel \
            libevdev-devel \
            libinput-devel \
            Mesa-libEGL-devel \
            libpixman-1-0-devel \
            libXcursor-devel

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - name: Install Zig for the pinned River version
        run: |
          archive="$RUNNER_TEMP/zig-0.16.0.tar.xz"
          curl --fail --location --retry 3 \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            --output "$archive"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "ZIG=$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" >> "$GITHUB_ENV"

      - name: Extract version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Prepare source tarball
        run: |
          VER=${{ steps.version.outputs.version }}
          mkdir -p ~/rpmbuild/{SOURCES,SPECS}
          tar czf ~/rpmbuild/SOURCES/notion-river-${VER}.tar.gz \
            --transform "s,^,notion-river-${VER}/," \
            --exclude='.git' --exclude='target' \
            .
          cp notion-river.spec ~/rpmbuild/SPECS/

      - name: Build RPM
        run: |
          VER=${{ steps.version.outputs.version }}
          rpmbuild -bb ~/rpmbuild/SPECS/notion-river.spec \
            --define "version ${VER}" \
            --define "zig $ZIG" \
            --define "_topdir $HOME/rpmbuild"

      - name: Copy RPM to workspace
        run: cp ~/rpmbuild/RPMS/*/*.rpm .

      - name: Upload .rpm
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: "*.rpm"
