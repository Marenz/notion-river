[package]
name = "notion-river"
version = "0.5.3"
edition = "2024"
description = "A Notion/Ion3-style static tiling window manager for River"

[dependencies]
bitflags = "2.13"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
wayland-backend = "0.3.16"
wayland-client = "0.31.15"
wayland-scanner = "0.31.11"
xkbcommon = { version = "0.9", features = ["wayland"] }
dirs = "6"
libc = "0.2"
serde_json = "1"
cairo-rs = { version = "0.22", features = ["freetype"] }
pangocairo = "0.22"
pango = "0.22"
